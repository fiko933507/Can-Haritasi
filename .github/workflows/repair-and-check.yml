name: Repair and check source

on:
  push:
    branches: [main, v1.3-community-cute-ui]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/repair_source.py'
      - '.github/workflows/repair-and-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair source encoding and auth callback
        run: python scripts/repair_source.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo dependency check
        run: npx expo install --check

      - name: Typecheck
        run: npm run typecheck

      - name: Commit repair if needed
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add App.tsx
            git commit -m "fix: restore Turkish UTF-8 text and native auth callback"
            git push
          else
            echo "No source repair needed."
          fi
