name: Android production AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-production-aab.yml'
      - 'app.json'

permissions:
  contents: read
  actions: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npx expo install --check
          npm run typecheck

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Restore production upload key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-output previous-release
          gh run download 35358739737 \
            --repo "${{ github.repository }}" \
            --name can-haritasi-v1.4-production-aab-and-upload-key \
            --dir previous-release
          cp previous-release/can-haritasi-upload.jks release-output/
          cp previous-release/UPLOAD-KEY-CREDENTIALS.txt release-output/
          STORE_PASSWORD="$(sed -n 's/^Store password: //p' release-output/UPLOAD-KEY-CREDENTIALS.txt)"
          KEY_PASSWORD="$(sed -n 's/^Key password: //p' release-output/UPLOAD-KEY-CREDENTIALS.txt)"
          KEY_ALIAS="$(sed -n 's/^Alias: //p' release-output/UPLOAD-KEY-CREDENTIALS.txt)"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "CH_KEYSTORE_PATH=$GITHUB_WORKSPACE/release-output/can-haritasi-upload.jks"
            echo "CH_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CH_KEY_ALIAS=$KEY_ALIAS"
            echo "CH_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Configure release signing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          signing_anchor = "    signingConfigs {\n        debug {"
          release_config = """    signingConfigs {
              release {
                  storeFile file(System.getenv('CH_KEYSTORE_PATH'))
                  storePassword System.getenv('CH_STORE_PASSWORD')
                  keyAlias System.getenv('CH_KEY_ALIAS')
                  keyPassword System.getenv('CH_KEY_PASSWORD')
              }
              debug {"""
          if signing_anchor not in s:
              raise SystemExit("Expected signingConfigs block not found")
          s = s.replace(signing_anchor, release_config, 1)

          build_types_at = s.index("    buildTypes {")
          release_at = s.index("        release {", build_types_at)
          debug_signing = "            signingConfig signingConfigs.debug"
          signing_at = s.index(debug_signing, release_at)
          s = s[:signing_at] + "            signingConfig signingConfigs.release" + s[signing_at + len(debug_signing):]

          p.write_text(s, encoding="utf-8")
          PY

      - name: Build signed production AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Verify AAB and archive release files
        shell: bash
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab release-output/Can-Haritasi-v1.4.1-production.aab
          jarsigner -verify release-output/Can-Haritasi-v1.4.1-production.aab
          keytool -list             -keystore release-output/can-haritasi-upload.jks             -storepass "$CH_STORE_PASSWORD"             -alias "$CH_KEY_ALIAS"             -rfc > release-output/UPLOAD-KEY-CERTIFICATE.pem
          sha256sum release-output/Can-Haritasi-v1.4.1-production.aab > release-output/SHA256SUMS.txt
          test -s release-output/Can-Haritasi-v1.4.1-production.aab

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: can-haritasi-v1.4.1-code5-production-aab-and-upload-key
          path: release-output/
          if-no-files-found: error
          retention-days: 14
