name: Android test APK

# v1.4-playful-theme-notification-center
on:
  workflow_dispatch:
  push:
    branches: [main, v1.3-community-cute-ui]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-test-apk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair direct email/password auth flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('App.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(", callbackURL: NEON_AUTH_URL", "")
          p.write_text(s, encoding='utf-8')
          PY
          if ! git diff --quiet -- App.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add App.tsx
            git commit -m "fix: use direct email password auth without Expo proxy"
            git push
          else
            echo "Email/password auth flow already uses direct requests."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install push notifications
        run: npx expo install expo-notifications

      - name: Align Expo SDK dependencies
        run: npx expo install --fix

      - name: Persist dependency alignment if changed
        shell: bash
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: align Expo SDK 57 dependency versions"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          else
            echo "Expo dependencies already aligned."
          fi

      - name: Verify Expo dependencies
        run: npx expo install --check

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: can-haritasi-v1.4-playful-notifications-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
